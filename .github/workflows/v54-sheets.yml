name: v54 sheets and white-screen fix
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v54_sheets_fix.py"
      - ".github/workflows/v54-sheets.yml"
      - "sheets.html"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render printable pages to images
        run: |
          sudo apt-get update -y
          sudo apt-get install -y poppler-utils
          mkdir -p sheets
          pdftoppm -jpeg -r 100 -jpegopt quality=68 1-visual-supports.pdf sheets/visual
          pdftoppm -jpeg -r 100 -jpegopt quality=68 2-colouring-book.pdf sheets/colour
          pdftoppm -jpeg -r 100 -jpegopt quality=68 3-learning-cards.pdf sheets/learn
          pdftoppm -jpeg -r 100 -jpegopt quality=68 4-aac-symbols.pdf sheets/aac
          python3 - << 'PY'
          from pathlib import Path
          import json
          labels = {
            "visual": "Visual supports",
            "colour": "Colouring",
            "learn": "Learning cards",
            "aac": "AAC board",
          }
          sheets = []
          for prefix, label in labels.items():
              files = sorted(Path("sheets").glob(f"{prefix}-*.jpg"), key=lambda p: int(p.stem.split("-")[-1]))
              for i, p in enumerate(files, 1):
                  sheets.append({"src": f"sheets/{p.name}", "title": f"{label} · {i}"})
          Path("sheets.js").write_text("var PRINTABLE_SHEETS = " + json.dumps(sheets) + ";\n", encoding="utf-8")
          print("wrote", len(sheets), "sheets")
          PY
      - name: Patch app.html
        run: python v54_sheets_fix.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js sheets sheets.js sheets.html v54_sheets_fix.py
          git diff --cached --quiet || git commit -m "fix: tap-to-save printable sheets and stop iPad white reload"
          git push
