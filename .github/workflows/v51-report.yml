name: v51 report cleanup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v51_report_dedupe.py"
      - ".github/workflows/v51-report.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dedupe report helper copy
        run: python v51_report_dedupe.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git diff --cached --quiet || git commit -m "fix: one meeting-summary hint on Report"
          git push
