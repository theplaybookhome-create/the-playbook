name: apply-theme
on:
  workflow_dispatch:
  push:
    paths:
      - "apply_theme.py"
      - "social_patch.py"
      - "canva_assets_patch.py"
      - "canva_assets.json"
      - ".github/workflows/apply-theme.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium dashboard theme to app.html
        run: |
          set -euo pipefail
          python3 apply_theme.py
          python3 social_patch.py
          python3 canva_assets_patch.py
          test "$(wc -c < app.html)" -gt 165000
          grep -q 'home-hero' app.html
          grep -q firstNameOf app.html
          grep -q 'Premium dashboard theme' app.html
          grep -q alreadyPaid app.html
          grep -q tiktok app.html
          grep -q THEME_BUILD_V19 app.html
          grep -q hchip app.html
          grep -q energy-spark-wrap app.html
          grep -q pp-cover app.html
          grep -q cover-complete.jpg app.html
          grep -q brand-mark-img app.html
          grep -q playbook-v19 sw.js
          test -s icon-192.png
          test -s cover-complete.jpg
          if grep -q 'id: "instagram"' app.html; then echo "instagram still listed" && exit 1; fi
          if grep -q 'id: "whatsapp"' app.html; then echo "whatsapp still listed" && exit 1; fi
          git config user.name "theplaybookhome-create"
          git config user.email "theplaybookhome@gmail.com"
          git add app.html sw.js icon-192.png icon-180.png icon-512.png icon-maskable-512.png favicon.png brand-1024.png cover-complete.jpg cover-visual.jpg cover-colouring.jpg cover-learning.jpg cover-aac.jpg
          git diff --cached --quiet || git commit -m "Canva assets: header mark, printable covers, PWA icons (V19)"
          git push origin HEAD:main
