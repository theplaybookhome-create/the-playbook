name: v38 school cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v38_school_cloud_patch.py"
      - "school.html"
      - "SCHOOL_SHARE.sql"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply school-cloud patch
        run: python v38_school_cloud_patch.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js school.html SCHOOL_SHARE.sql
          git diff --cached --quiet || git commit -m "feat: teacher can add notes via school link"
          git push
