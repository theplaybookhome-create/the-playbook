name: v38 school cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v38_school_cloud_patch.py"
      - "v41_split_school_ux.py"
      - "v42_unmix_share_ux.py"
      - "v43_fix_boot.py"
      - "v44_school_send_fix.py"
      - "v45_school_tab.py"
      - "school.html"
      - "SCHOOL_SHARE.sql"
      - ".github/workflows/v38-school.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply school-cloud patch
        run: python v38_school_cloud_patch.py
      - name: Split teacher link from report
        run: python v41_split_school_ux.py
      - name: Unmix teacher form vs meeting summary
        run: python v42_unmix_share_ux.py
      - name: Fix boot crash and login reload
        run: python v43_fix_boot.py
      - name: Fix teacher send (anon publish)
        run: python v44_school_send_fix.py
      - name: School notes tab
        run: python v45_school_tab.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js school.html SCHOOL_SHARE.sql
          git diff --cached --quiet || git commit -m "feat: school tab + latest teacher note on Today"
          git push
