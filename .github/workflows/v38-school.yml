name: v38 school cloud
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v47_school_verify.py"
      - "school.html"
      - "SCHOOL_SHARE.sql"
      - ".github/workflows/v38-school.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: School tab + verify inbox
        run: python v47_school_verify.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js school.html SCHOOL_SHARE.sql
          git diff --cached --quiet || git commit -m "fix: school tab, latest note on Today, check for notes"
          git push
