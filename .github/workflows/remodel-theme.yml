name: remodel-theme
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/remodel-theme.yml"
      - "theme_payload.0"
      - "theme_payload.1"
      - "theme_payload.2"
      - "sw.js"
permissions:
  contents: write
jobs:
  remodel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode remodeled app.html
        run: |
          set -euo pipefail
          cat theme_payload.0 theme_payload.1 theme_payload.2 | base64 -d | gzip -dc > app.html
          test "$(wc -c < app.html)" -gt 170000
          grep -q "home-greet" app.html
          grep -q "EnergySpark" app.html
          grep -q "dash-kpis" app.html
          grep -q "alreadyPaid" app.html
          grep -q "isClockSkewError" app.html
          git config user.name "theplaybookhome-create"
          git config user.email "theplaybookhome@gmail.com"
          git add app.html sw.js
          git diff --cached --quiet || git commit -m "Remodel: Today, login, printables grid, Insights dashboard"
          git push origin HEAD:main
