name: remodel-theme
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remodel-theme.yml'
      - 'theme_patch.py'
      - 'sw.js'
permissions:
  contents: write
jobs:
  remodel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply paid-user + JWT fixes (and full theme if patch exists)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app.html")
          s = p.read_text(encoding="utf-8")
          changed = False

          if "{showOnboard && !unlocked && (" not in s:
              if "{showOnboard && (" in s:
                  s = s.replace("{showOnboard && (", "{showOnboard && !unlocked && (", 1)
                  changed = True
              else:
                  raise SystemExit("onboard gate not found")

          old_load = '''      setShowOnboard(ob !== "1");
      setUnlocked(pu === "1");'''
          new_load = '''      const alreadyPaid = pu === "1";
      setShowOnboard(ob !== "1" && !alreadyPaid);
      setUnlocked(alreadyPaid);
      if (alreadyPaid) {
        setShowOnboard(false);
        try { await storageSet("onboard-seen", "1"); } catch (e) {}
      }'''
          if "const alreadyPaid" not in s:
              if old_load not in s:
                  raise SystemExit("onboard load block not found")
              s = s.replace(old_load, new_load, 1)
              changed = True

          old_prem = """        if (userHasPremiumFlag(u)) {
          await grantLocalPremium();
          setUnlocked(true);
          setShowPaywall(false);
        }"""
          new_prem = """        if (userHasPremiumFlag(u)) {
          await grantLocalPremium();
          setUnlocked(true);
          setShowPaywall(false);
          setShowOnboard(false);
          try { localStorage.setItem("playbook:onboard-seen", "1"); } catch (e) {}
        }"""
          try:
              after = s.split("if (userHasPremiumFlag(u))")[1][:400]
          except Exception:
              after = ""
          if "setShowOnboard(false);" not in after:
              if old_prem in s:
                  s = s.replace(old_prem, new_prem, 1)
                  changed = True

          if "function isClockSkewError" not in s:
              old_client = '''function getSupabase() {
  if (!CLOUD_ENABLED || !window.supabase) return null;
  if (!window.__pb_supabase) {
    window.__pb_supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  return window.__pb_supabase;
}'''
              new_client = '''function isClockSkewError(err) {
  const m = String((err && err.message) || err || "").toLowerCase();
  return m.indexOf("jwt issued") >= 0 || m.indexOf("issued at future") >= 0 || m.indexOf("future date") >= 0;
}

function getSupabase() {
  if (!CLOUD_ENABLED || !window.supabase) return null;
  if (!window.__pb_supabase) {
    window.__pb_supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
    });
  }
  return window.__pb_supabase;
}

async function safeGetSession(sb) {
  if (!sb) return { session: null };
  try {
    const { data, error } = await sb.auth.getSession();
    if (error && isClockSkewError(error)) {
      console.warn("clock skew on getSession — keeping stored session", error.message);
      return { session: data && data.session ? data.session : null };
    }
    if (error) console.warn("getSession", error);
    return { session: data && data.session ? data.session : null };
  } catch (e) {
    if (isClockSkewError(e)) console.warn("clock skew on getSession — continuing");
    else console.warn("getSession error", e);
    return { session: null };
  }
}'''
              if old_client not in s:
                  raise SystemExit("getSupabase block missing")
              s = s.replace(old_client, new_client, 1)
              changed = True

          old_show = '''  const show = useCallback((message, type = "default") => {
    if (timer.current) clearTimeout(timer.current);
    setToast({ message, type });
    timer.current = setTimeout(() => setToast(null), 2400);
  }, []);'''
          new_show = '''  const show = useCallback((message, type = "default") => {
    if (typeof isClockSkewError === "function" && isClockSkewError(message)) { console.warn("suppressed auth clock toast", message); return; }
    if (timer.current) clearTimeout(timer.current);
    setToast({ message, type });
    timer.current = setTimeout(() => setToast(null), 2400);
  }, []);'''
          if "suppressed auth clock toast" not in s and old_show in s:
              s = s.replace(old_show, new_show, 1)
              changed = True

          s = s.replace(
              "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js",
              "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js",
              1
          )

          old_gs = '''    const sessionPromise = sb.auth.getSession().then(({ data }) => data).catch((e) => {
      console.warn("getSession error", e);
      return { session: null };
    });'''
          new_gs = '''    const sessionPromise = (typeof safeGetSession === "function" ? safeGetSession(sb) : sb.auth.getSession().then(({ data }) => data)).catch((e) => {
      console.warn("getSession error", e);
      return { session: null };
    });'''
          if "safeGetSession(sb)" not in s and old_gs in s:
              s = s.replace(old_gs, new_gs, 1)
              changed = True

          p.write_text(s, encoding="utf-8")
          print("critical-fix bytes", p.stat().st_size, "changed", changed)
          PY
          if [ -f theme_patch.py ]; then
            python3 theme_patch.py || echo "theme_patch skipped/failed — critical fixes still applied"
          fi
          grep -q "showOnboard && !unlocked" app.html
          grep -q "isClockSkewError" app.html
          git config user.name "theplaybookhome-create"
          git config user.email "theplaybookhome@gmail.com"
          git add app.html sw.js
          git diff --cached --quiet || git commit -m "Fix: hide welcome sheet for paid users, suppress JWT clock-skew banner"
          git push origin HEAD:main
