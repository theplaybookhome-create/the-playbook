name: remodel-theme
on:
  workflow_dispatch:
  push:
    paths:
      - "theme_payload.0"
      - "theme_payload.1"
      - "theme_payload.2"
permissions:
  contents: write
jobs:
  remodel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode remodeled app.html
        run: |
          set -euo pipefail
          if [ ! -f theme_payload.0 ]; then
            echo "No payload files; skip"
            exit 0
          fi
          cat theme_payload.0 theme_payload.1 theme_payload.2 | base64 -d | gzip -dc > app.html
          test "$(wc -c < app.html)" -gt 170000
          grep -q "home-greet" app.html
          git config user.name "theplaybookhome-create"
          git config user.email "theplaybookhome@gmail.com"
          git add app.html
          git diff --cached --quiet || git commit -m "Apply decoded theme payload"
          git push origin HEAD:main
