name: v44 teacher ux
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v44_teacher_ux.py"
      - ".github/workflows/v44-teacher.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply teacher UX patch
        run: python v44_teacher_ux.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git diff --cached --quiet || git commit -m "fix: teacher form copy toast, Teacher log section, report duplicate"
          git push
