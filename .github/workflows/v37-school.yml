name: v37 school link
on:
  push:
    branches: [main]
    paths:
      - "v37_school_link_patch.py"
      - "school.html"
      - "app.html"
      - "sw.js"
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply school-link patch
        run: python v37_school_link_patch.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html sw.js
          git diff --cached --quiet || git commit -m "chore: apply v37 school-link patch"
          git push
