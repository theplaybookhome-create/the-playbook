name: v28-like
on:
  workflow_dispatch:
  push:
    paths:
      - v28_like_patch.py
      - v29_home_patch.py
      - v30_spec_patch.py
      - v31_nav_social_patch.py
      - .github/workflows/v28-like.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V31 social + nav
        run: |
          set -euo pipefail
          python3 v31_nav_social_patch.py app.html
          grep -q THEME_BUILD_V31 app.html
          grep -q "V31 social + bottom nav" app.html
          grep -q "V31 line icons" app.html
          sed -i 's/playbook-v30/playbook-v31/g; s/playbook-v29/playbook-v31/g' sw.js
          grep -q playbook-v31 sw.js
          git config user.name "theplaybookhome-create"
          git config user.email "theplaybookhome@gmail.com"
          git add app.html sw.js v31_nav_social_patch.py
          git diff --cached --quiet || git commit -m "V31: matching line social icons and 5-item navy nav with orange active border"
          git push origin HEAD:main
