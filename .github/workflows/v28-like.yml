name: v28-like
on:
  workflow_dispatch:
  push:
    paths:
      - v28_like_patch.py
      - .github/workflows/v28-like.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V28 like-for-like mockup
        run: |
          set -euo pipefail
          python3 v28_like_patch.py app.html
          grep -q THEME_BUILD_V28 app.html
          grep -q ql-sun-art app.html
          grep -q v28sky app.html
          grep -q home-mid app.html
          ! grep -q 'label: "Instagram"' app.html
          ! grep -q 'label: "YouTube"' app.html
          sed -i 's/playbook-v27/playbook-v28/g; s/playbook-v26/playbook-v28/g' sw.js
          grep -q playbook-v28 sw.js
          git config user.name "theplaybookhome-create"
          git config user.email "theplaybookhome@gmail.com"
          git add app.html sw.js v28_like_patch.py
          git diff --cached --quiet || git commit -m "V28: like-for-like tablet mockup — mountain sunrise, four social cards, dark header"
          git push origin HEAD:main
