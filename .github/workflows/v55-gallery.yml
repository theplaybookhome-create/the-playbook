name: v55 save to gallery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "v55_gallery_save.py"
      - ".github/workflows/v55-gallery.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python v55_gallery_save.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html v55_gallery_save.py
          git diff --cached --quiet || git commit -m "fix: save printables to photo gallery"
          git push
