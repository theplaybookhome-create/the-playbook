<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Printables — THE PLAYBOOK</title>
  <meta name="theme-color" content="#0E131F" />
  <style>
    :root { --navy:#0E131F; --orange:#FF6B00; --paper:#F6F3EE; --ink:#12202B; --soft:#5B6773; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--paper); color:var(--ink); }
    header { position:sticky; top:0; z-index:5; background:var(--navy); color:#fff; padding:12px 16px 14px; }
    header a { color:#FFD0A8; font-weight:700; text-decoration:none; font-size:13px; }
    h1 { margin:8px 0 4px; font-size:22px; }
    .sub { margin:0; color:#C9D1D8; font-size:13px; line-height:1.45; }
    #hint { margin:10px 16px 0; font-size:13px; color:#3E4A55; min-height:1.2em; }
    .feed { padding:12px 14px 40px; display:flex; flex-direction:column; gap:14px; max-width:720px; margin:0 auto; }
    .sheet { background:#fff; border-radius:16px; overflow:hidden; box-shadow:0 8px 24px rgba(18,32,43,.08); }
    .sheet img { width:100%; display:block; background:#fff; -webkit-touch-callout:default; }
    .cap { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px 12px; }
    .cap strong { font-size:14px; }
    .cap button {
      appearance:none; border:0; font-style:normal; font-size:12px; font-weight:800; color:#fff;
      background:var(--orange); border-radius:999px; padding:8px 12px; font-family:inherit; cursor:pointer;
    }
    .empty { padding:24px; color:var(--soft); }
  </style>
  <script src="./sheets.js"></script>
</head>
<body>
  <header>
    <a href="./app.html">← Back to THE PLAYBOOK</a>
    <h1>Printables</h1>
    <p class="sub">Scroll the pages. Tap Save to gallery. On iPad choose Save Image so it lands in Photos.</p>
  </header>
  <p id="hint"></p>
  <div class="feed" id="feed"><p class="empty">Loading sheets…</p></div>
  <script>
    const feed = document.getElementById("feed");
    const hint = document.getElementById("hint");
    const sheets = window.PRINTABLE_SHEETS || [];
    function say(msg) { hint.textContent = msg || ""; }
    async function saveSheet(sheet) {
      say("Preparing " + sheet.title + "…");
      try {
        const res = await fetch(sheet.src, { credentials: "same-origin" });
        if (!res.ok) throw new Error("missing");
        const blob = await res.blob();
        const rawName = (sheet.src.split("/").pop() || "playbook-sheet.jpg");
        const name = rawName.replace(/\.[^.]+$/, ".jpg");
        const imgBlob = blob.type && blob.type.indexOf("image/") === 0 ? blob : new Blob([blob], { type: "image/jpeg" });
        if (navigator.share && navigator.canShare) {
          const f = new File([imgBlob], name, { type: "image/jpeg" });
          if (navigator.canShare({ files: [f] })) {
            await navigator.share({ files: [f], title: sheet.title, text: "Save Image to add this to your gallery" });
            say("Tap Save Image / Add to Photos.");
            return;
          }
        }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(imgBlob);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        say("Saved. Check Photos, gallery or Downloads.");
      } catch (e) {
        if (e && e.name === "AbortError") { say(""); return; }
        say("Long-press the picture instead, then tap Add to Photos.");
      }
    }
    if (!sheets.length) {
      feed.innerHTML = '<p class="empty">Sheets are still publishing. Open this page again in a minute.</p>';
    } else {
      feed.innerHTML = "";
      sheets.forEach(function (sheet) {
        const card = document.createElement("div");
        card.className = "sheet";
        card.innerHTML = '<img src="' + sheet.src + '" alt="' + sheet.title + '"><div class="cap"><strong>' + sheet.title + '</strong><button type="button">Save to gallery</button></div>';
        card.querySelector("button").onclick = function () { saveSheet(sheet); };
        card.querySelector("img").onclick = function () { saveSheet(sheet); };
        feed.appendChild(card);
      });
    }
  </script>
</body>
</html>
