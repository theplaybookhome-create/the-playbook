/* ===== V35 voice logging ===== */
.voice-btn{
  flex:0 0 auto; width:46px; height:46px; border-radius:14px; border:1.5px solid #E6E8EC;
  background:#fff; color:#0E131F; font-size:18px; cursor:pointer; display:grid; place-items:center;
  transition:background .15s, border-color .15s, transform .1s;
}
.voice-btn:hover{ border-color:#FF8A2B; background:#FFF4EB; }
.voice-btn.recording{ border-color:#FF6B00; background:#FFE4D6; color:#FF6B00; animation:pbPulse 1s infinite; }
.voice-btn:active{ transform:scale(.94); }
.voice-btn:disabled{ opacity:.4; cursor:not-allowed; }
.voice-status{ font-size:12px; color:#6B7280; margin-top:6px; min-height:16px; }
.voice-status.live{ color:#FF6B00; font-weight:700; }
@keyframes pbPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,107,0,.35);} 50%{ box-shadow:0 0 0 8px rgba(255,107,0,0);} }
@media (prefers-reduced-motion:reduce){ .voice-btn.recording{ animation:none; } }

    window.storage = {
      async get(key) {
        try {
          const v = localStorage.getItem("playbook:" + key);
          return v === null ? null : { value: v };
        } catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem("playbook:" + key, value); return true; }
        catch (e) { console.error(e); return false; }
      }
    };

})();

function formatEntryHeader(entry, fields) {
  const dateField = fields.find((f) => f.type === "date");
  if (dateField && entry[dateField.key]) {
    const d = new Date(entry[dateField.key] + "T00:00:00");
    if (!isNaN(d)) return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  }
  const first = fields[0];
  if (first && entry[first.key]) return String(entry[first.key]);

function entryMatchesQuery(entry, fields, query) {
  if (!query) return true;
  const q = query.toLowerCase().trim();
  if (!q) return true;
  for (const f of fields) {
    const val = entry[f.key];
    if (val == null) continue;
    if (Array.isArray(val)) { if (val.some((v) => String(v).toLowerCase().includes(q))) return true; }
    else if (String(val).toLowerCase().includes(q)) return true;
  }
  return false;
}
function sortEntries(entries, fields, sortMode) {
  const copy = [...entries];
  const dateKey = fields.find((f) => f.type === "date")?.key;
  copy.sort((a, b) => {
    if (dateKey && a[dateKey] && b[dateKey]) {
      const cmp = a[dateKey].localeCompare(b[dateKey]);
      if (cmp !== 0) return sortMode === "oldest" ? cmp : -cmp;
    }
    return sortMode === "oldest" ? (a.id || "").localeCompare(b.id || "") : (b.id || "").localeCompare(a.id || "");
  });

}

function shiftISO(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);

function friendlyDate(iso) {

  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  const today = todayISO();
  const yest = shiftISO(-1);
  if (iso === today) return "Today";
  if (iso === yest) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function TicksField({ fieldKey, defaults, selected, onToggle }) {
  const [custom, setCustom] = useState(() => loadCustomOptions(fieldKey));
  const [draft, setDraft] = useState("");
  const all = useMemo(() => {
    const seen = new Set();
    const out = [];
    [...defaults, ...custom].forEach((o) => {
      const k = o.trim();
      if (!k) return;
      const low = k.toLowerCase();
      if (seen.has(low)) return;
      seen.add(low);
      out.push(k);
    });
    return out;
  }, [defaults, custom]);
  function addCustom(e) {
    if (e) e.preventDefault();
    const name = draft.trim();
    if (!name) return;
    const low = name.toLowerCase();
    if (all.some((o) => o.toLowerCase() === low)) {
      onToggle(all.find((o) => o.toLowerCase() === low) || name);
      setDraft("");
      return;
    }
    const next = [...custom, name];
    setCustom(next);
    saveCustomOptions(fieldKey, next);
    onToggle(name); // select it immediately
    setDraft("");
  }
  function removeCustom(opt, e) {
    e.stopPropagation();
    const next = custom.filter((c) => c !== opt);
    setCustom(next);
    saveCustomOptions(fieldKey, next);
    // deselect if selected
    if ((selected || []).includes(opt)) onToggle(opt);
  }
  return (
    <div>
      <div className="tick-row">
        {all.map((opt) => {
          const active = (selected || []).includes(opt);
          const isCustom = custom.includes(opt);
          return (
            <button type="button" key={opt} className={"tick-chip" + (active ? " active" : "") + (isCustom ? " custom-opt" : "")} onClick={() => onToggle(opt)}>
              <span className="tick-box">{active ? "✓" : ""}</span>
              {opt}
              {isCustom && (
                <span className="chip-x" title="Remove your option" onClick={(e) => removeCustom(opt, e)}>✕</span>
              )}
            </button>
          );
        })}
      </div>
      <div className="tick-add-row">
        <input
          type="text"
          value={draft}
          placeholder="Add your own…"
          maxLength={40}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); addCustom(e); } }}
        />
        <button type="button" className="tick-add-btn" onClick={addCustom}>+ Add</button>
      </div>
    </div>
  );
}

function filterByDays(entries, days) {
  if (!days || days === "all") return entries || [];
  const cutoff = new Date();
  cutoff.setDate(cutoff.getDate() - days);
  const iso = cutoff.toISOString().slice(0, 10);
  return (entries || []).filter((e) => e.date && e.date >= iso);
}
function countMap(items) {
  const map = {};
  (items || []).forEach((t) => { if (t) map[t] = (map[t] || 0) + 1; });
  return Object.entries(map).sort((a, b) => b[1] - a[1]);
}
function buildStories(dataStore, days) {
  const daily = filterByDays(dataStore["daily-log-entries"] || [], days);
  const behavior = filterByDays(dataStore["behavior-log-entries"] || [], days);
  const sleep = filterByDays(dataStore["sleep-food-entries"] || [], days);
  const wins = filterByDays(dataStore["wins-entries"] || [], days);
  const stories = [];
  const energies = daily.map((e) => Number(e.energy)).filter((n) => n >= 1 && n <= 5);
  const avgE = energies.length ? (energies.reduce((a, b) => a + b, 0) / energies.length) : null;
  const triggers = countMap(behavior.flatMap((e) => e.triggers || []));
  const moods = countMap(daily.flatMap((e) => e.mood || []));
  const helped = behavior.map((e) => e.whatHelped).filter((x) => x && String(x).trim());
  const rough = sleep.filter((e) => {
    const q = e.quality || [];
    return q.includes("Rough night") || (e.sleepNotes && /wake|rough|night/i.test(e.sleepNotes));
  }).length;

  if (triggers.length) {
    const [top, n] = triggers[0];
    const total = behavior.length || 1;
    stories.push({
      kicker: "Top pattern",
      text: `"${top}" shows up in ${n} of your ${behavior.length} behaviour log${behavior.length === 1 ? "" : "s"} in this period.`,
      meta: triggers.slice(0, 3).map(([t, c]) => `${t} ×${c}`).join(" · ")
    });
  }
  if (avgE != null) {
    const label = avgE >= 4 ? "relatively steady energy" : avgE >= 3 ? "mixed energy days" : "lower energy days overall";
    stories.push({
      kicker: "Energy",
      text: `Average energy is ${avgE.toFixed(1)} / 5 — ${label}.`,
      meta: energies.length + " scored day" + (energies.length === 1 ? "" : "s")
    });
  }
  if (rough > 0 && energies.length >= 3) {
    stories.push({
      kicker: "Sleep link",
      text: `${rough} rough night${rough === 1 ? "" : "s"} logged. Worth comparing energy the next day when you talk to school or GP.`,
      meta: "From sleep notes"
    });
  }
  if (moods.length) {
    stories.push({
      kicker: "Mood picture",
      text: `Most logged moods: ${moods.slice(0, 3).map(([m, c]) => `${m} (${c})`).join(", ")}.`,
      meta: "From daily logs"
    });
  }
  if (helped.length) {
    stories.push({
      kicker: "What already helps",
      text: `You've noted strategies that worked — take these into appointments.`,
      meta: helped.slice(0, 2).map((h) => String(h).slice(0, 60)).join(" · ")
    });
  }
  if (wins.length) {
    stories.push({
      kicker: "Strengths",
      text: `${wins.length} win${wins.length === 1 ? "" : "s"} logged — useful to balance hard days in any meeting.`,
      meta: wins[0].win ? String(wins[0].win).slice(0, 70) : ""
    });
  }
  if (!stories.length) {
    stories.push({
      kicker: "Getting started",
      text: "Log a few daily energy scores and one behaviour note — insights appear here automatically.",
      meta: "Private on this device"
    });
  }
  return { stories, avgE, triggers, moods, helped, rough, daily, behavior, sleep, wins, energies };
}
function buildTalkingPoints(analysis) {
  const pts = [];
  if (analysis.triggers.length) {
    const [t, n] = analysis.triggers[0];
    pts.push(`Main trigger pattern: ${t} (${n}×). Ask what support is available around this.`);
  }
  if (analysis.avgE != null && analysis.avgE < 3.2) {
    pts.push(`Energy average ${analysis.avgE.toFixed(1)}/5 — discuss fatigue, demand, or recovery time.`);
  }
  if (analysis.rough > 0) {
    pts.push(`Rough nights logged (${analysis.rough}). Explore sleep hygiene and daytime impact.`);
  }
  if (analysis.helped.length) {
    pts.push(`What helps at home: ${String(analysis.helped[0]).slice(0, 90)}. Can school/therapy mirror this?`);
  }
  if (analysis.wins.length) {
    pts.push(`Recent strength: ${String(analysis.wins[0].win || "").slice(0, 90) || "see wins list"}.`);
  }
  if (pts.length < 2) {
    pts.push("Share the printed summary and ask for one clear next step before you leave.");
  }
  return pts.slice(0, 5);
}

/* ===== V36 helpers: trial days, share link, med reminders ===== */
const FREE_LOG_DAYS = 7;

function countLoggedDays(dataStore) {
  const keys = ["daily-log-entries", "behavior-log-entries", "sleep-food-entries"];
  const dates = new Set();
  keys.forEach((k) => {
    (dataStore[k] || []).forEach((e) => { if (e && e.date) dates.add(String(e.date).slice(0, 10)); });
  });
  return dates.size;
}

function shiftISODate(iso, days) {
  const d = new Date(iso + "T12:00:00");
  if (isNaN(d.getTime())) return iso;
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

function reminderDueDate(entry) {
  if (!entry) return null;
  const ticks = Array.isArray(entry._reminder) ? entry._reminder : (entry._reminder ? [entry._reminder] : []);
  const base = (entry.date || todayISO()).slice(0, 10);
  if (ticks.indexOf("Remind me tomorrow") !== -1) return shiftISODate(base, 1);
  if (ticks.indexOf("Remind me in 2 days") !== -1) return shiftISODate(base, 2);
  return null;
}

function collectDueMedReminders(dataStore) {
  const today = todayISO();
  let dismissed = [];
  try { dismissed = JSON.parse(localStorage.getItem("playbook:med-dismissed") || "[]"); } catch (e) { dismissed = []; }
  if (!Array.isArray(dismissed)) dismissed = [];
  const out = [];
  (dataStore["medication-entries"] || []).forEach((e) => {
    const due = reminderDueDate(e);
    if (!due || due > today) return;
    if (dismissed.indexOf(e.id) !== -1) return;
    out.push({ id: e.id, name: e.name || "Medication", dose: e.dose || "", due: due });
  });
  return out;
}

function dismissMedReminder(id) {
  let dismissed = [];
  try { dismissed = JSON.parse(localStorage.getItem("playbook:med-dismissed") || "[]"); } catch (e) { dismissed = []; }
  if (!Array.isArray(dismissed)) dismissed = [];
  if (dismissed.indexOf(id) === -1) dismissed.push(id);
  try { localStorage.setItem("playbook:med-dismissed", JSON.stringify(dismissed)); } catch (e) {}
}

function encodeSharePayload(obj) {
  const json = JSON.stringify(obj);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function decodeShareParam() {
  try {
    const q = new URLSearchParams(window.location.search).get("share");
    if (!q) return null;
    let b64 = q.replace(/-/g, "+").replace(/_/g, "/");
    while (b64.length % 4) b64 += "=";
    const obj = JSON.parse(decodeURIComponent(escape(atob(b64))));
    if (!obj || obj.v !== 1) return null;
    return obj;
  } catch (e) { return null; }
}

function buildSharePayload(dataStore, profile, range) {
  const analysis = buildStories(dataStore, range || 14);
  const extra = (typeof detectPatterns === "function") ? detectPatterns(dataStore) : [];

    kicker: s.kicker || "Note",

  }));
  const points = buildTalkingPoints(analysis).slice(0, 5);
  const child = String((profile && (profile.nameAge || profile.name)) || "Child").split(" ")[0] || "Child";
  return {
    v: 1,
    app: "THE PLAYBOOK",
    child: child.slice(0, 24),
    range: range === "all" ? "All logged data" : ("Last " + (range || 14) + " days"),
    made: todayISO(),
    stories: stories,
    points: points,
    helped: (analysis.helped || []).slice(0, 4).map((h) => String(h).slice(0, 120)),
    avgE: analysis.avgE,
    logs: (analysis.daily || []).length + (analysis.behavior || []).length
  };
}

function greetingForNow() {
  const h = new Date().getHours();
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}
function firstNameOf(user) {
  if (!user) return "";
  const md = user.user_metadata || {};
  const raw = String(md.display_name || md.name || md.full_name || "").trim();
  if (raw) return raw.split(/\s+/)[0];
  const em = String(user.email || "").split("@")[0];
  const cleaned = em.replace(/[0-9]+/g, " ").replace(/[._-]+/g, " ").trim();
  const word = (cleaned.split(/\s+/)[0] || em);
  return word ? word.charAt(0).toUpperCase() + word.slice(1) : "";
}
function initialsOf(user) {
  const n = firstNameOf(user);
  if (n.length >= 2) return (n[0] + n[1]).toUpperCase();
  const em = String((user && user.email) || "U");
  return (em[0] + (em[1] || "P")).toUpperCase();
}

function EnergySpark({ values, avg }) {
  const pts = (values || []).filter((n) => n != null && !isNaN(n));
  const w = 280, h = 72, pad = 8;
  let path = "";
  if (pts.length) {
    const max = 5, min = 1;
    pts.forEach((v, i) => {
      const x = pad + (pts.length === 1 ? (w - pad * 2) / 2 : i * ((w - pad * 2) / Math.max(pts.length - 1, 1)));
      const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
      path += (i === 0 ? "M" : "L") + x.toFixed(1) + " " + y.toFixed(1) + " ";
    });
  }
  return (
    <div className="energy-spark">
      <div className="es-top">
        <h3>Energy ({pts.length} logs)</h3>
        <div className="es-avg" aria-hidden="true">›</div>
      </div>

function VoiceButton({ value, onChange }) {
  const [listening, setListening] = useState(false);
  const [supported, setSupported] = useState(true);
  const recRef = useRef(null);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { setSupported(false); return; }
    const r = new SR();
    r.lang = "en-GB";
    r.interimResults = false;
    r.maxAlternatives = 1;
    r.onresult = (e) => {
      const t = (e.results[0] && e.results[0][0] && e.results[0][0].transcript) || "";
      if (t) onChange(value ? (value + " " + t).trim() : t);
    };
    r.onend = () => setListening(false);
    r.onerror = (ev) => {
      setListening(false);
      const st = document.getElementById("ql-voice-status");
      if (st) {
        st.textContent = ev.error === "not-allowed"
          ? "Microphone blocked — allow it in browser settings."
          : "Couldn't hear that. Try again.";
        st.classList.remove("live");
      }
    };
    recRef.current = r;
    return () => { try { r.onresult = null; r.onend = null; r.onerror = null; r.stop(); } catch (e) {} };
  }, []);

  if (!supported) return null;

  function toggle() {
    const r = recRef.current;
    if (!r) return;
    const st = document.getElementById("ql-voice-status");
    if (listening) {
      try { r.stop(); } catch (e) {}
      setListening(false);
      if (st) { st.textContent = ""; st.classList.remove("live"); }
      return;
    }
    try {
      r.start();
      setListening(true);
      if (st) { st.textContent = "Listening… tap again to stop"; st.classList.add("live"); }
    } catch (e) {
      setListening(false);
    }
  }

  return (
    <button
      type="button"
      className={"voice-btn" + (listening ? " recording" : "")}
      onClick={toggle}
      aria-label={listening ? "Stop voice note" : "Speak a voice note"}
      title={listening ? "Stop" : "Tap to speak"}
    >
      {listening ? "⏹" : "🎤"}
    </button>
  );
}

// Pattern detection: rough-night → next-day low energy / meltdown link
function detectPatterns(dataStore) {
  const daily = (dataStore["daily-log-entries"] || []).slice().sort((a,b) => (a.date||"").localeCompare(b.date||""));
  const sleep = (dataStore["sleep-food-entries"] || []).slice().sort((a,b) => (a.date||"").localeCompare(b.date||""));
  const behavior = dataStore["behavior-log-entries"] || [];
  const byDate = {};
  daily.forEach((d) => { if (d.date) byDate[d.date] = d; });
  sleep.forEach((s) => { if (s.date) byDate[s.date] = Object.assign(byDate[s.date] || {}, { _sleep: s }); });
  const dates = Object.keys(byDate).sort();
  let roughFollowedByLow = 0, roughFollowedByMelt = 0, totalRough = 0;
  for (let i = 0; i < dates.length - 1; i++) {
    const today = byDate[dates[i]];
    const next = byDate[dates[i + 1]];
    const sq = (today._sleep && today._sleep.quality) || [];
    const rough = sq.includes("Rough night") || (today._sleep && /wake|rough|night/i.test(today._sleep.sleepNotes || ""));
    if (!rough) continue;
    totalRough++;
    if (next.energy != null && next.energy <= 2) roughFollowedByLow++;
    const nextBeh = behavior.filter((b) => b.date === dates[i + 1]);
    if (nextBeh.length) roughFollowedByMelt++;
  }
  const out = [];
  if (totalRough >= 2 && roughFollowedByLow >= 2) {
    out.push({ kicker: "Sleep → energy", text: totalRough + " rough nights logged, and " + roughFollowedByLow + " of the next days had low energy (2 or below). Worth raising at your next appointment.", meta: "From sleep + daily logs" });
  }
  if (totalRough >= 2 && roughFollowedByMelt >= 2) {
    out.push({ kicker: "Sleep → behaviour", text: roughFollowedByMelt + " behaviour logs landed on the day after a rough night. A consistent link — useful evidence for school or GP.", meta: "From sleep + behaviour logs" });
  }
  return out;
}

function printableUrl(file) {
  try {
    return new URL(PRINTABLES_BASE + file, window.location.href).href;
  } catch (e) {
    return PRINTABLES_BASE + file;
  }
}

async function savePdfFile(file, title) {
  const url = printableUrl(file);
  try {
    const res = await fetch(url, { credentials: "same-origin" });
    if (!res.ok) throw new Error("fetch " + res.status);
    const blob = await res.blob();
    const pdfBlob = blob.type && blob.type.indexOf("pdf") >= 0 ? blob : new Blob([blob], { type: "application/pdf" });
    const name = file.split("/").pop() || "playbook-printable.pdf";
    if (navigator.share && navigator.canShare) {
      try {
        const f = new File([pdfBlob], name, { type: "application/pdf" });
        if (navigator.canShare({ files: [f] })) {
          await navigator.share({ files: [f], title: title || "THE PLAYBOOK printable" });
          return "shared";
        }
      } catch (err) {
        if (err && err.name === "AbortError") return "cancelled";
      }
    }
    const obj = URL.createObjectURL(pdfBlob);
    const a = document.createElement("a");
    a.href = obj;
    a.download = name;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(obj); }, 4000);
    return "downloaded";
  } catch (e) {
    window.open(url, "_blank", "noopener,noreferrer");
    return "opened";
  }
}

function PdfViewerModal({ pack, onClose }) {
  const url = printableUrl(pack.file);
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  async function onSave() {
    setBusy(true);
    setNote("");
    const result = await savePdfFile(pack.file, pack.title);
    setBusy(false);
    if (result === "shared") setNote("Shared — choose Save to Files or Print.");
    else if (result === "downloaded") setNote("Download started. Check your Files or Downloads folder.");
    else if (result === "opened") setNote("Opened in browser. Use Share → Save to Files if needed.");
    else if (result === "cancelled") setNote("");
  }
  return (
    <div className="pdf-modal-backdrop" role="dialog" aria-modal="true" aria-label={pack.title}>
      <div className="pdf-modal">
        <div className="pdf-modal-bar">
          <strong>{pack.title}</strong>
          <button type="button" className="pdf-modal-save" onClick={onSave} disabled={busy}>
            {busy ? "Saving…" : "Save / Share"}
          </button>
          <a className="pdf-modal-open" href={url} target="_blank" rel="noopener noreferrer">Open</a>
          <button type="button" className="pdf-modal-close" onClick={onClose}>← Back to app</button>
        </div>
        <iframe className="pdf-modal-frame" title={pack.title} src={url} />
        <div className="pdf-modal-hint">
          {note || "You stay in THE PLAYBOOK. Use Save / Share to keep a copy, or Back to app when finished."}
        </div>
      </div>
    </div>
  );
}

    const boost = new Set();
    topTriggers.forEach((t) => {
      const low = String(t).toLowerCase();
      if (/noise|loud|sound|crowd/.test(low)) { boost.add("sensory"); boost.add("calm"); }
      if (/transition|routine|change/.test(low)) { boost.add("calm"); boost.add("comm"); }
      if (/hunger|food|texture/.test(low)) { boost.add("sensory"); }
      if (/tired|sleep/.test(low)) { boost.add("calm"); }
      if (/motor|movement|swing/.test(low)) { boost.add("motor"); }
    });
    return boost;
  }, [topTriggers]);

    const list = [...TOYS];

      return sb - sa;

function TrackPage({ dataStore, setDataStore, learningTicked, setLearningTicked, profile, setProfile, brainDump, setBrainDump, showToast, initialSub, activeChildId }) {
  const [sub, setSub] = useState(initialSub || "daily");
  useEffect(() => { if (initialSub) setSub(initialSub); }, [initialSub]);
  const active = TRACK_ITEMS.find((n) => n.id === sub) || TRACK_ITEMS[0];
  async function toggleLearning(id) {
    const next = { ...learningTicked, [id]: !learningTicked[id] };
    setLearningTicked(next);
    await storageSet(scopeKey("learning-play-ticked", activeChildId), JSON.stringify(next));
  }
  async function saveProfile(values) {
    setProfile(values);
    await storageSet(scopeKey("at-a-glance-profile", activeChildId), JSON.stringify(values));
    showToast("Profile saved — handy for sitters & school");
  }
  async function saveBrain(val) {
    setBrainDump(val);
    await storageSet(scopeKey("brain-dump-text", activeChildId), val);
  }
  async function clearBrain() {
    if (!window.confirm("Clear the brain dump? This can't be undone.")) return;
    setBrainDump("");
    await storageSet(scopeKey("brain-dump-text", activeChildId), "");
    showToast("Brain dump cleared");
  }
  return (
    <div>
      <div className="sub-nav">
        {TRACK_ITEMS.map((item) => (
          <button key={item.id} type="button" className={"sub-btn" + (sub === item.id ? " active" : "")} onClick={() => setSub(item.id)}>{item.label}</button>
        ))}
      </div>
      {active.type === "learning" ? <LearningPlayPage ticked={learningTicked} onToggle={toggleLearning} />
        : active.type === "atAGlance" ? <AtAGlancePage profile={profile} onSave={saveProfile} showToast={showToast} />
        : active.type === "brainDump" ? <BrainDumpPage text={brainDump} onChange={saveBrain} onClear={clearBrain} showToast={showToast} />
        : (
          <ListSection
            storageKey={scopeKey(active.storageKey, activeChildId)} title={active.title} subtitle={active.subtitle} fields={active.fields} footerNote={active.footerNote}
            entries={dataStore[active.storageKey] || []}
            onEntriesChange={(next) => setDataStore((d) => ({ ...d, [active.storageKey]: next }))}
            showToast={showToast}
          />
        )}
    </div>
  );
}

function App() {
  const [mainTab, setMainTab] = useState("home");
  const [trackSub, setTrackSub] = useState("daily");
  const [discTab, setDiscTab] = useState("printables");
  const [loaded, setLoaded] = useState(false);
  const [dataStore, setDataStore] = useState({});
  const [learningTicked, setLearningTicked] = useState({});
  const [profile, setProfile] = useState({});
  const [brainDump, setBrainDump] = useState("");
  const [children, setChildren] = useState([]);
  const [activeChildId, setActiveChildId] = useState(null);
  const [showChildModal, setShowChildModal] = useState(false);
  const [childDraftName, setChildDraftName] = useState("");
  const [communityPosts, setCommunityPosts] = useState(SEED_COMMUNITY);
  const [communityLikes, setCommunityLikes] = useState({});
  const [discoverPosts, setDiscoverPosts] = useState([]);
  const [showOnboard, setShowOnboard] = useState(false);
  const [unlocked, setUnlocked] = useState(false);
  const [showPaywall, setShowPaywall] = useState(false);
  const [session, setSession] = useState(null);
  const [authReady, setAuthReady] = useState(!CLOUD_ENABLED);
  const [recoveryMode, setRecoveryMode] = useState(false);
  const [loginOpen, setLoginOpen] = useState(function () {
    try {
      const params = new URLSearchParams(window.location.search);
      return params.get("login") === "1" || params.get("mode") === "login";
    } catch (e) { return false; }
  });
  const [pendingWipe, setPendingWipe] = useState(false);
  const fileInputRef = useRef(null);
  const { show: showToast, ToastEl } = useToast();
  const cloudMode = CLOUD_ENABLED;
  const user = session && session.user ? session.user : null;

  useEffect(() => {
    let cancelled = false;
    async function loadAll() {
      // Children profiles
      let kids = [];
      try {
        const rawKids = await storageGet("children");
        kids = rawKids ? JSON.parse(rawKids) : [];
        if (!Array.isArray(kids)) kids = [];
      } catch { kids = []; }
      let activeId = await storageGet("active-child-id");

      // Migrate legacy unscoped logs → first child
      if (!kids.length) {
        const defaultChild = { id: newChildId(), name: "My child" };
        kids = [defaultChild];
        activeId = defaultChild.id;
        await storageSet("children", JSON.stringify(kids));
        await storageSet("active-child-id", activeId);
        for (const item of TRACK_ITEMS.filter((n) => n.storageKey)) {
          const legacy = await storageGet(item.storageKey);
          if (legacy) await storageSet(scopeKey(item.storageKey, activeId), legacy);
        }
        const legLP = await storageGet("learning-play-ticked");
        const legPF = await storageGet("at-a-glance-profile");
        const legBD = await storageGet("brain-dump-text");
        if (legLP) await storageSet(scopeKey("learning-play-ticked", activeId), legLP);
        if (legPF) await storageSet(scopeKey("at-a-glance-profile", activeId), legPF);
        if (legBD) await storageSet(scopeKey("brain-dump-text", activeId), legBD);
      }
      if (!activeId || !kids.find((k) => k.id === activeId)) {
        activeId = kids[0].id;
        await storageSet("active-child-id", activeId);
      }

      const results = await loadScopedStore(activeId);
      const lp = await storageGet(scopeKey("learning-play-ticked", activeId));
      const pf = await storageGet(scopeKey("at-a-glance-profile", activeId));
      const bd = await storageGet(scopeKey("brain-dump-text", activeId));
      const cp = await storageGet("community-posts");
      const cl = await storageGet("community-likes");
      const ob = await storageGet("onboard-seen");
      const pu = await storageGet("premium-unlocked");
      if (cancelled) return;
      setChildren(kids);
      setActiveChildId(activeId);
      setDataStore(results);
      try { setLearningTicked(lp ? JSON.parse(lp) : {}); } catch { setLearningTicked({}); }
      try { setProfile(pf ? JSON.parse(pf) : {}); } catch { setProfile({}); }
      setBrainDump(bd || "");
      try {
        const parsed = cp ? JSON.parse(cp) : null;
        if (Array.isArray(parsed) && parsed.length) setCommunityPosts([...parsed, ...SEED_COMMUNITY.filter((s) => !parsed.find((p) => p.id === s.id))]);
      } catch { /* keep seed */ }
      try { setCommunityLikes(cl ? JSON.parse(cl) : {}); } catch { setCommunityLikes({}); }
      const alreadyPaid = pu === "1";
      setShowOnboard(ob !== "1" && !alreadyPaid);
      setUnlocked(alreadyPaid);
      if (alreadyPaid) {
        setShowOnboard(false);
        try { await storageSet("onboard-seen", "1"); } catch (e) {}
      }

      try {
        const params = new URLSearchParams(window.location.search);
        const t = params.get("tab");
        if (t && ["today","track","insights","report","community","discover","printables","home"].includes(t)) {
          if (t === "printables") { setMainTab("discover"); setDiscTab("printables"); }
          else setMainTab(t === "today" ? "home" : t);
        }
      } catch (e) {}

      setLoaded(true);
    }
    loadAll();
    return () => { cancelled = true; };
  }, []);


  useEffect(() => {
    if (!loaded) return;
    const due = collectDueMedReminders(dataStore);
    if (!due.length) return;
    if (!("Notification" in window)) return;
    const fire = () => {
      try {
        due.slice(0, 3).forEach((m) => {
          new Notification("THE PLAYBOOK", { body: "Med reminder: " + m.name + (m.dose ? " · " + m.dose : ""), tag: "med-" + m.id });
        });
      } catch (e) {}
    };
    if (Notification.permission === "granted") fire();
    else if (Notification.permission !== "denied") {
      Notification.requestPermission().then((p) => { if (p === "granted") fire(); }).catch(() => {});
    }
  }, [loaded, dataStore]);


  useEffect(() => {
    if (!CLOUD_ENABLED) { setAuthReady(true); return; }
    const sb = getSupabase();
    if (!sb) { setAuthReady(true); return; }
    async function applyAccountPremium(sess) {
      try {
        const u = sess && sess.user;
        if (!u) return;
        // If this device just returned from Stripe, write premium onto the account
        if (window.__pb_just_unlocked || localStorage.getItem("playbook:premium-unlocked") === "1") {
          await persistPremiumToAccount();
          window.__pb_just_unlocked = false;
        }
        if (userHasPremiumFlag(u)) {
          await grantLocalPremium();
          setUnlocked(true);
          setShowPaywall(false);
          setShowOnboard(false);
          try { localStorage.setItem("playbook:onboard-seen", "1"); } catch (e) {}
        }
      } catch (e) { console.warn(e); }
    }
    // iOS Chrome can hang indefinitely on getSession; race with timeout so free path always continues
    const sessionPromise = sb.auth.getSession().then(({ data }) => data).catch((e) => {
      console.warn("getSession error", e);
      return { session: null };
    });
    const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve({ session: null, timedOut: true }), 4000));
    Promise.race([sessionPromise, timeoutPromise]).then(async (data) => {
      if (data && data.timedOut) console.warn("getSession timed out (iOS) — continuing without session");
      const sess = data && data.session ? data.session : null;
      setSession(sess);
      setAuthReady(true);
      await applyAccountPremium(sess);
    });
    const { data: sub } = sb.auth.onAuthStateChange(async (event, sess) => {
      setSession(sess);
      if (event === "PASSWORD_RECOVERY") setRecoveryMode(true);
      if (event === "USER_UPDATED") setRecoveryMode(false);
      if (event === "SIGNED_IN" || event === "INITIAL_SESSION" || event === "TOKEN_REFRESHED" || event === "USER_UPDATED") {
        await applyAccountPremium(sess);
      }
    });
    return () => { try { sub.subscription.unsubscribe(); } catch (e) {} };
  }, []);

  async function refreshCommunity() {
    const sb = getSupabase();
    if (!sb) return;
    const { data, error } = await sb.from("community_posts").select("*").order("created_at", { ascending: false }).limit(50);
    if (error) { console.error(error); showToast(error.message || "Could not load community", "error"); return; }
    const mapped = (data || []).map((row) => ({
      id: row.id,
      author: row.author_name || "Member",
      time: row.created_at ? new Date(row.created_at).toLocaleString() : "",
      body: row.body,
      tags: row.tag ? [row.tag] : [],
      link: row.link || "",
      likes: row.likes || 0,
      local: false
    }));
    setCommunityPosts(mapped.length ? mapped : SEED_COMMUNITY);
  }

  async function refreshDiscover() {
    const sb = getSupabase();
    if (!sb) return;
    const { data, error } = await sb.from("discover_posts").select("*").order("created_at", { ascending: false }).limit(50);
    if (error) { console.error(error); return; }
    setDiscoverPosts((data || []).map((row) => ({
      id: row.id,
      kind: row.kind,
      title: row.title,
      body: row.body,
      url: row.url || "",
      author: row.author_name || "Member",
      time: row.created_at ? new Date(row.created_at).toLocaleString() : ""
    })));
  }

  useEffect(() => {
    if (!CLOUD_ENABLED || !session) return;
    refreshCommunity();
    refreshDiscover();
  }, [session]);

  function navigate(tab, sub, disc) { setMainTab(tab === "printables" ? "discover" : tab); if (sub) setTrackSub(sub); if (disc) setDiscTab(disc); if (tab === "printables") setDiscTab("printables"); }

  async function switchChild(id) {
    if (!id || id === activeChildId) return;
    await storageSet("active-child-id", id);
    setActiveChildId(id);
    const results = await loadScopedStore(id);
    setDataStore(results);
    const lp = await storageGet(scopeKey("learning-play-ticked", id));
    const pf = await storageGet(scopeKey("at-a-glance-profile", id));
    const bd = await storageGet(scopeKey("brain-dump-text", id));
    try { setLearningTicked(lp ? JSON.parse(lp) : {}); } catch { setLearningTicked({}); }
    try { setProfile(pf ? JSON.parse(pf) : {}); } catch { setProfile({}); }
    setBrainDump(bd || "");
    showToast("Switched child profile");
  }
  async function addChild(name) {
    const n = (name || "").trim() || ("Child " + (children.length + 1));
    const child = { id: newChildId(), name: n };
    const next = [...children, child];
    setChildren(next);
    await storageSet("children", JSON.stringify(next));
    setShowChildModal(false);
    setChildDraftName("");
    await switchChild(child.id);
    showToast("Added " + n);
  }
  async function renameChild(id, name) {
    const n = (name || "").trim();
    if (!n) return;
    const next = children.map((c) => c.id === id ? { ...c, name: n } : c);
    setChildren(next);
    await storageSet("children", JSON.stringify(next));
    showToast("Name updated");
  }

  async function dismissOnboard() { setShowOnboard(false); await storageSet("onboard-seen", "1"); }
  async function handleUnlock() {
    if (STRIPE_PAYMENT_LINK && STRIPE_PAYMENT_LINK.indexOf("http") === 0) {
      window.location.href = STRIPE_PAYMENT_LINK;
      return;
    }
    // Demo / offline unlock until Stripe link is pasted above
    await storageSet("premium-unlocked", "1");
    setUnlocked(true);
    setShowPaywall(false);
    await persistPremiumToAccount();
    showToast("Unlocked · thank you");
  }
  async function restorePurchase() {
    try {
      const sb = getSupabase();
      if (!sb || !user) {
        showToast("Log in with the email you used to pay, then tap Restore", "error");
        return;
      }
      // Refresh user from server
      const { data: refreshed } = await sb.auth.getUser();
      const u = (refreshed && refreshed.user) || user;
      if (userHasPremiumFlag(u) || window.__pb_just_unlocked || (await storageGet("premium-unlocked")) === "1") {
        await storageSet("premium-unlocked", "1");
        setUnlocked(true);
        setShowPaywall(false);
        await persistPremiumToAccount();
        showToast("Purchase restored on this device", "success");
        return;
      }
      showToast("No purchase found on this account. Use the same email you paid with, or open the unlock link from your receipt.", "error");
    } catch (e) {
      console.error(e);
      showToast("Could not restore — try again", "error");
    }
  }
  function requestUnlock() { setShowPaywall(true); }
  async function addCommunityPost(post) {
    if (CLOUD_ENABLED) {
      const sb = getSupabase();
      if (!sb || !user) { showToast("Log in to post", "error"); return; }
      if (!unlocked) { requestUnlock(); return; }
      const { error } = await sb.from("community_posts").insert({
        body: post.body,
        tag: post.tag || null,
        link: post.link || null,
        author_name: post.author || "Member",
        user_id: user.id,
        likes: 0
      });
      if (error) { showToast(error.message || "Post failed", "error"); return; }
      showToast("Posted to the community");
      await refreshCommunity();
      return;
    }
    const entry = {
      id: "u-" + Date.now().toString(36),
      author: post.author || "You",
      time: "Just now",
      body: post.body,
      tags: post.tag ? [post.tag] : [],
      link: post.link || "",
      likes: 0,
      local: true
    };

async function copyTextFallback(text) {
  if (!text) return false;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return !!ok;
  } catch (e) {
    return false;
  }
}
function schoolToken() {
  const bytes = new Uint8Array(12);
  if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
  else for (let i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
  return "s" + Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
}
function loadSchoolLinks() {
  try {
    const raw = localStorage.getItem("playbook:school-links");
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveSchoolLinks(list) {
  try { localStorage.setItem("playbook:school-links", JSON.stringify(list)); } catch (e) {}
}
function loadSavedSchoolNotes() {
  try {
    const raw = localStorage.getItem("playbook:school-notes");
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveSavedSchoolNotes(list) {
  try { localStorage.setItem("playbook:school-notes", JSON.stringify(list.slice(0, 40))); } catch (e) {}
}
function schoolLinkFor(token) {
  const origin = (window.location && window.location.origin) || "https://theplaybook.cloud";
  return origin.replace(/\/$/, "") + "/school.html?t=" + encodeURIComponent(token);
}
function mapSchoolRow(row) {
  return {
    id: row.id || row.sentAt || String(row.created_at || Date.now()),
    token: row.token,
    child: row.child || "Child",
    date: row.note_date || row.date || "",
    mood: row.mood || "",
    energy: row.energy || "",
    incidents: row.incidents || "",
    wins: row.wins || "",
    note: row.body || row.note || "",
    author: row.author_name || row.author || "Teacher",
    sentAt: row.created_at || row.sentAt || ""
  };
}
async function schoolRestHeaders() {
  return {
    apikey: SUPABASE_ANON_KEY,
    Authorization: "Bearer " + SUPABASE_ANON_KEY,
    "Content-Type": "application/json"
  };
}
async function publishSchoolLink(entry) {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return { ok: false, reason: "no-cloud" };
  try {
    const res = await fetch(SUPABASE_URL + "/rest/v1/playbook_share_links", {
      method: "POST",
      headers: Object.assign(await schoolRestHeaders(), { Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify({
        token: entry.token,
        label: entry.label,
        child_label: entry.child || null,
        active: true
      })
    });
    if (!res.ok && res.status !== 409) {
      const txt = await res.text();
      return { ok: false, reason: txt || String(res.status) };
    }
    return { ok: true };
  } catch (e) {
    return { ok: false, reason: (e && e.message) || "network" };
  }
}
async function revokeSchoolLinkCloud(token) {
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY) return;
  try {
    await fetch(SUPABASE_URL + "/rest/v1/playbook_share_links?token=eq." + encodeURIComponent(token), {
      method: "PATCH",
      headers: Object.assign(await schoolRestHeaders(), { Prefer: "return=minimal" }),
      body: JSON.stringify({ active: false })
    });
  } catch (e) {}
}
async async function fetchSchoolNotesForTokens(tokens) {
  const local = loadSavedSchoolNotes();
  const uniq = [];
  (tokens || []).forEach(function (t) {
    const s = String(t || "").trim();
    if (s && uniq.indexOf(s) === -1) uniq.push(s);
  });
  if (!SUPABASE_URL || !SUPABASE_ANON_KEY || !uniq.length) return { notes: local, error: null };
  try {
    const collected = [];
    let lastErr = null;
    for (let i = 0; i < uniq.length; i++) {
      const res = await fetch(
        SUPABASE_URL + "/rest/v1/playbook_school_notes?token=eq." + encodeURIComponent(uniq[i]) + "&select=*&order=created_at.desc&limit=40",
        { headers: { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY } }
      );
      if (!res.ok) {
        lastErr = { message: await res.text() };
        continue;
      }
      const data = await res.json();
      (data || []).forEach(function (row) { collected.push(mapSchoolRow(row)); });
    }
    const byId = {};
    local.forEach(function (n) { if (n && n.id) byId[n.id] = n; });
    collected.forEach(function (n) { if (n && n.id) byId[n.id] = n; });
    const merged = Object.keys(byId).map(function (k) { return byId[k]; });
    merged.sort(function (a, b) { return String(b.sentAt || "").localeCompare(String(a.sentAt || "")); });
    saveSavedSchoolNotes(merged);
    return { notes: merged, error: collected.length ? null : lastErr };
  } catch (e) {
    return { notes: local, error: e };
  }
}

function SchoolLinkCard({ showToast }) {
  const [links, setLinks] = useState(() => loadSchoolLinks());
  const [copied, setCopied] = useState("");
  const [copyState, setCopyState] = useState("");
  const [setupHint, setSetupHint] = useState("");

  async function copyUrl(url) {
    const ok = await copyTextFallback(url);
    setCopied(url);
    setCopyState(ok ? "copied" : "manual");
    if (ok && showToast) showToast("Copied successfully", "success");
    else if (!ok && showToast) showToast("Link ready — copy it from the green box");
    return ok;
  }

  async function shareUrl(url) {
    try {
      if (navigator.share) {
        await navigator.share({ title: "Playbook school note", text: "Please add today's note for our child.", url: url });
        return;
      }
    } catch (e) {}
    await copyUrl(url);
  }

  async function makeLink() {
    const token = schoolToken();
    const entry = { token: token, created: todayISO(), label: "Teacher form " + (links.length + 1) };
    const next = [entry, ...links].slice(0, 20);
    setLinks(next);
    saveSchoolLinks(next);
    const url = schoolLinkFor(token);
    await copyUrl(url);
    try {
      const published = await Promise.race([
        publishSchoolLink(entry),
        new Promise(function (resolve) { setTimeout(function () { resolve({ ok: false, reason: "timeout" }); }, 5000); })
      ]);
      if (!published || !published.ok) {
        setSetupHint("Link is copied. If the teacher cannot send, cloud tables may still need setup.");
      } else {
        setSetupHint("");
      }
    } catch (e) {
      setSetupHint("Link is copied. Teacher send needs an internet connection.");
    }
  }

  async function copyExisting(token) {
    const url = schoolLinkFor(token);
    await copyUrl(url);
  }

  async function revoke(token) {
    const next = links.filter(function (l) { return l.token !== token; });
    setLinks(next);
    saveSchoolLinks(next);
    if (copied && copied.indexOf(token) !== -1) { setCopied(""); setCopyState(""); }
    await revokeSchoolLinkCloud(token);
    if (showToast) showToast("Link revoked");
  }

  return (
    <div className="school-card">
      <h3>Teacher form link</h3>
      <p><b>This is not the professional report.</b> The teacher gets a short form (mood, energy, incidents, wins). They never see your diary. Sent notes land on this School tab. Today only shows the latest one.</p>
      <button type="button" className="btn-primary" style={{ width: "100%" }} onClick={makeLink}>{copyState === "copied" ? "Copied successfully — create another" : "Create teacher form link"}</button>
      {copied ? (
        <div className="school-copied" role="status">
          <strong>{copyState === "copied" ? "Copied successfully" : "Link created — copy it below"}</strong>
          <span className="sc-url">{copied}</span>
          <p className="sc-hint">Send this to the teacher. The address must include school.html — if it includes share= you copied the meeting summary by mistake.</p>
          <div className="sc-actions">
            <button type="button" className="btn-secondary" style={{ padding: "8px 12px", fontSize: 13 }} onClick={function () { copyUrl(copied); }}>Copy again</button>
            <button type="button" className="btn-amber" style={{ padding: "8px 12px", fontSize: 13 }} onClick={function () { shareUrl(copied); }}>Share with teacher</button>
          </div>
        </div>
      ) : null}
      {links.length > 0 && (
        <div style={{ marginTop: 12 }}>
          {links.map(function (l) {
            return (
              <div key={l.token} style={{ display: "flex", gap: 8, alignItems: "center", marginBottom: 8, flexWrap: "wrap" }}>
                <span style={{ fontSize: 12, color: "#6B7280", flex: "1 1 160px" }}>{l.label} · {l.created}</span>
                <button type="button" className="btn-secondary" style={{ padding: "6px 10px", fontSize: 12 }} onClick={function () { copyExisting(l.token); }}>Copy</button>
                <button type="button" className="btn-secondary" style={{ padding: "6px 10px", fontSize: 12 }} onClick={function () { window.open(schoolLinkFor(l.token), "_blank"); }}>Open form to test</button>
                <button type="button" className="btn-secondary" style={{ padding: "6px 10px", fontSize: 12, color: "#B03A2E" }} onClick={function () { revoke(l.token); }}>Revoke</button>
              </div>
            );
          })}
        </div>
      )}
      {setupHint ? <div className="school-setup">{setupHint}</div> : null}
    </div>
  );
}

function SchoolInbox({ showToast, latestOnly, onSeeAll, title }) {
  const [inbox, setInbox] = useState(() => loadSavedSchoolNotes());
  const [status, setStatus] = useState("");
  const [checkedAt, setCheckedAt] = useState("");
  const [busy, setBusy] = useState(false);
  const linkCount = loadSchoolLinks().length;

  async function refresh() {
    setBusy(true);
    const tokens = loadSchoolLinks().map(function (l) { return l.token; });
    if (!tokens.length) {
      setInbox([]);
      setStatus("Create a teacher form link first, then send it to school.");
      setCheckedAt(new Date().toLocaleTimeString());
      setBusy(false);
      return;
    }
    const result = await fetchSchoolNotesForTokens(tokens);
    const notes = result.notes || [];
    setInbox(notes);
    setCheckedAt(new Date().toLocaleTimeString());
    if (result.error && !notes.length) setStatus("Could not reach the school inbox. Check you are online, then tap Check again.");
    else if (!notes.length) setStatus("No teacher notes yet. Open the form on another phone, tap Send to parent, then tap Check again.");
    else setStatus("");
    setBusy(false);
  }

  useEffect(function () {
    refresh();
    const id = setInterval(refresh, 12000);
    return function () { clearInterval(id); };
  }, []);

  function dismiss(id) {
    const next = inbox.filter(function (x) { return x.id !== id; });
    setInbox(next);
    saveSavedSchoolNotes(next);
    if (showToast) showToast("School update hidden on this device");
  }

  const shown = latestOnly ? inbox.slice(0, 1) : inbox;

  return (
    <div className="school-inbox" style={{ marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
        <h3 style={{ fontSize: 15, margin: 0 }}>{title || (latestOnly ? "Latest teacher note" : "All teacher notes")}</h3>
        {latestOnly && onSeeAll ? (
          <button type="button" className="btn-secondary" style={{ padding: "6px 10px", fontSize: 12 }} onClick={onSeeAll}>See all</button>
        ) : null}
      </div>
      {shown.map(function (s) {
        return (
          <div className="school-entry" key={s.id} role="status">
            <div className="se-head">
              <span className="se-date">Received · {s.date || ""} · {s.author || "Teacher"}</span>
              {latestOnly ? null : (
                <button type="button" className="se-del" aria-label="Dismiss" onClick={function () { dismiss(s.id); }}>✕</button>
              )}
            </div>
            <div>
              <span className="se-tag">{s.child || "Child"}</span>
              {s.mood ? <span className="se-tag">{s.mood}</span> : null}
              {s.energy ? <span className="se-tag">Energy: {s.energy}</span> : null}
              {s.incidents ? <span className="se-tag">Incidents: {s.incidents}</span> : null}
            </div>
            {s.wins ? <div className="se-line"><b>Wins:</b> {s.wins}</div> : null}
            {s.note ? <div className="se-line"><b>Note:</b> {s.note}</div> : null}
          </div>
        );
      })}
      {!shown.length ? <p style={{ fontSize: 13, color: "#6B7280", margin: "0 0 8px" }}>{status || "No teacher notes yet."}</p> : null}
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
        <button type="button" className="btn-secondary" style={{ padding: "8px 12px", fontSize: 13 }} onClick={refresh} disabled={busy}>{busy ? "Checking…" : "Check for notes"}</button>
        {latestOnly && onSeeAll ? <button type="button" className="btn-secondary" style={{ padding: "8px 12px", fontSize: 13 }} onClick={onSeeAll}>School tab</button> : null}
      </div>
      <p style={{ fontSize: 11, color: "#9CA3AF", margin: "6px 0 0" }}>
        {linkCount ? (linkCount + " teacher link" + (linkCount === 1 ? "" : "s") + " on this phone") : "No teacher link on this phone yet"}
        {checkedAt ? " · last check " + checkedAt : ""}
      </p>
    </div>
  );
}

function SchoolNotesPage({ showToast }) {
  return (
    <div>
      <PageHeader kicker="From school" title="Teacher notes" subtitle="Create the teacher form here. After they send it, tap Check for notes. Today only keeps the most recent one." />
      <SchoolLinkCard showToast={showToast} />
      <SchoolInbox showToast={showToast} title="All teacher notes" />
    </div>
  );
}
