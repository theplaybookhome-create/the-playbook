<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE PLAYBOOK — Loading…</title>
  <style>body{margin:0;background:#F7F6F4;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#2C3E50}p{opacity:.7}</style>
</head>
<body>
  <p>Loading THE PLAYBOOK…</p>
  <script>
  (function(){
    var urls = [
      'https://cdn.jsdelivr.net/gh/theplaybookhome-create/the-playbook@339eac0a139ee3ccb47caceacd73018dd6e6ee28/app.html',
      'https://raw.githubusercontent.com/theplaybookhome-create/the-playbook/339eac0a139ee3ccb47caceacd73018dd6e6ee28/app.html'
    ];
    function load(i){
      if(i>=urls.length){document.body.innerHTML='<p style="padding:24px;text-align:center">Could not load app. Open <a href="https://theplaybook.cloud/">theplaybook.cloud</a> again shortly.</p>';return;}
      fetch(urls[i]).then(function(r){if(!r.ok)throw new Error('bad');return r.text()}).then(function(html){
        document.open();document.write(html);document.close();
      }).catch(function(){load(i+1)});
    }
    load(0);
  })();
  </script>
</body>
</html>
