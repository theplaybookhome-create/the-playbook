<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE PLAYBOOK — Loading…</title>
  <style>body{margin:0;background:#F7F6F4;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#2C3E50}p{opacity:.7}</style>
</head>
<body>
  <p>Loading THE PLAYBOOK…</p>
  <script>
  (function () {
    var urls = [
      "./app.html.html",
      "./app-multi-child-printables.html"
    ];
    function load(i) {
      if (i >= urls.length) {
        document.body.innerHTML = '<p style="padding:24px;text-align:center">Could not load. Hard-refresh the page.</p>';
        return;
      }
      fetch(urls[i], { cache: "no-store" })
        .then(function (r) { if (!r.ok) throw new Error("bad"); return r.text(); })
        .then(function (html) {
          if (!html || html.indexOf("THE PLAYBOOK") < 0 || html.indexOf("PLACEHOLDER") >= 0) throw new Error("empty");
          document.open();
          document.write(html);
          document.close();
        })
        .catch(function () { load(i + 1); });
    }
    load(0);
  })();
  </script>
</body>
</html>
