<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>THE PLAYBOOK</title></head>
<body><p style="font-family:sans-serif;text-align:center;margin-top:40vh;color:#5C6570">Loading THE PLAYBOOK…</p>
<script>
(function(){
  Promise.all([
    fetch("pb_part1.txt").then(function(r){return r.text()}),
    fetch("pb_part2.txt").then(function(r){return r.text()})
  ]).then(function(parts){
    var b64 = parts[0]+parts[1];
    var bin = atob(b64);
    var u8 = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    if (!window.DecompressionStream) {
      document.body.innerHTML = "<p style=\"text-align:center;padding:24px\">Please use Safari or Chrome.</p>";
      return;
    }
    return new Response(new Blob([u8]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  }).then(function(html){
    if (!html) return;
    document.open(); document.write(html); document.close();
  }).catch(function(e){
    console.error(e);
    document.body.innerHTML = "<p style=\"text-align:center;padding:24px\">Could not start. Hard-refresh the page.</p>";
  });
})();
</script></body></html>
