  <title>THE PLAYBOOK — For neurodivergent families</title>
  <style>body { margin: 0; background: #F7F6F4; }</style>
</head>
<body>
  <div id="root"></div>
  <script>
    window.storage = {
      async get(key) {
        try {
          const v = localStorage.getItem("playbook:" + key);
          return v === null ? null : { value: v };
        } catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem("playbook:" + key, value); return true; }
        catch (e) { console.error(e); return false; }
      }
    };
  

// Stripe / Payment Link return: ?unlocked=1
(function() {
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get("unlocked") === "1") {
      localStorage.setItem("playbook:premium-unlocked", "1");
      window.__pb_just_unlocked = true;
      // clean URL without reload loop
      const url = new URL(window.location.href);
      url.searchParams.delete("unlocked");
      window.history.replaceState({}, "", url.pathname + url.search + url.hash);
    }
  } catch (e) {}
})();

// Demo seed for screenshots / trailer (?demo=1)
(function() {
  try {
    const params = new URLSearchParams(window.location.search);
    if (params.get("demo") !== "1") return;
    function d(n) { const x = new Date(); x.setDate(x.getDate() - n); return x.toISOString().slice(0,10); }
    const daily = [
      { id: "d0", date: d(0), energy: 4, mood: ["Calm","Happy"], activities: ["School/daycare","Outdoors"], wentWell: "Park after school — smooth transition", challenges: "", notes: "Headphones in bag helped" },
      { id: "d1", date: d(1), energy: 2, mood: ["Wobbly","Overwhelmed"], activities: ["School/daycare","Appointment"], wentWell: "Got through the morning", challenges: "Loud assembly", notes: "" },
      { id: "d2", date: d(2), energy: 3, mood: ["Calm"], activities: ["Therapy","Outdoors"], wentWell: "OT session went well", challenges: "", notes: "" },
      { id: "d3", date: d(3), energy: 5, mood: ["Happy"], activities: ["Outdoors","Screen time"], wentWell: "Full afternoon at the park", challenges: "", notes: "" },
      { id: "d4", date: d(4), energy: 3, mood: ["Wobbly"], activities: ["School/daycare"], wentWell: "Asked for a break", challenges: "Transition to PE", notes: "" },
      { id: "d5", date: d(5), energy: 2, mood: ["Overwhelmed","Shutdown"], activities: ["School/daycare","New food"], wentWell: "", challenges: "Canteen noise + new lunch", notes: "Pack familiar snack next time" },
      { id: "d6", date: d(6), energy: 4, mood: ["Calm","Happy"], activities: ["Therapy","Outdoors"], wentWell: "Speech practice at home", challenges: "", notes: "" }
    ];
    localStorage.setItem("playbook:daily-log-entries", JSON.stringify(daily));
    localStorage.setItem("playbook:behavior-log-entries", JSON.stringify([
      { id: "b1", date: d(1), timeOfDay: "3:40pm", whatHappened: "Meltdown after school pickup — hands on ears, refused car seat", triggers: ["Transition","Loud noise","Tired"], whatITried: "Quiet voice, offered water", whatHelped: "Noise-cancelling headphones + 5 min swing at park", notesNextTime: "Headphones ready before school bell" },
      { id: "b2", date: d(5), timeOfDay: "12:15pm", whatHappened: "Shutdown in canteen — stopped eating, head down", triggers: ["Crowd","Texture","Loud noise"], whatITried: "Moved to quieter table", whatHelped: "Familiar snack from home", notesNextTime: "Request quieter seating" }
    ]));
    localStorage.setItem("playbook:wins-entries", JSON.stringify([
      { id: "w1", date: d(0), win: "Asked for headphones before assembly", notes: "Self-advocacy win" },
      { id: "w2", date: d(4), win: "Used break card in class", notes: "" },
      { id: "w3", date: d(2), win: "Tried one new food texture without distress", notes: "" }
    ]));
    localStorage.setItem("playbook:sleep-food-entries", JSON.stringify([
      { id: "s1", date: d(0), sleepQuality: 4, notes: "Asleep by 8:30" },
      { id: "s2", date: d(1), sleepQuality: 2, notes: "Night waking x2" }
    ]));
    localStorage.setItem("playbook:onboard-seen", "1");
    localStorage.setItem("playbook:premium-unlocked", "1");
    window.__DEMO_TAB = params.get("tab") || "today";
  } catch (e) { console.error(e); }
})();

</script>
