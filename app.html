<body>
  <div id="root" style="padding:40px;text-align:center;color:#5C6570">

    // Temporary: redirect to a known good state or show recovery
    setTimeout(function() {
      document.getElementById('root').innerHTML = '<p style="padding:40px;text-align:center;color:#5C6570">If this persists, open <a href="https://theplaybook.cloud/">theplaybook.cloud</a> and hard-refresh (pull down).</p>';

  </script>
