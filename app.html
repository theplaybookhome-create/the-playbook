<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2C3E50" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>THE PLAYBOOK</title>
  <style>
    body { margin: 0; background: #F7F6F4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1F1F1F; }
    #boot { max-width: 420px; margin: 48px auto; padding: 28px 22px; background: #fff; border-radius: 16px; box-shadow: 0 4px 24px rgba(44,62,80,0.08); text-align: center; }
    #boot h1 { font-size: 18px; letter-spacing: 1px; color: #2C3E50; margin: 0 0 12px; }
    #boot p { font-size: 14px; color: #5C6570; line-height: 1.5; margin: 0 0 8px; }
  </style>
</head>
<body>
  <div id="boot"><h1>THE PLAYBOOK</h1><p>Loading…</p></div>
  <script>
  (function () {
    var SRC = "https://raw.githubusercontent.com/theplaybookhome-create/the-playbook/14c235d84416fe7955219fc724b2f23edfe5bea1/app.html";
    function applyIosSessionTimeoutFix(html) {
      var needle = "sb.auth.getSession().then(async ({ data }) => {\n      setSession(data.session || null);\n      setAuthReady(true);\n      await applyAccountPremium(data.session || null);\n    });";
      var patch = [
        "// iOS Chrome can hang indefinitely on getSession; race with timeout so free path always continues",
        "const sessionPromise = sb.auth.getSession().then(({ data }) => data).catch((e) => {",
        "  console.warn(\"getSession error\", e);",
        "  return { session: null };",
        "});",
        "const timeoutPromise = new Promise((resolve) => setTimeout(() => resolve({ session: null, timedOut: true }), 4000));",
        "Promise.race([sessionPromise, timeoutPromise]).then(async (data) => {",
        "  if (data && data.timedOut) console.warn(\"getSession timed out (iOS) — continuing without session\");",
        "  const sess = data && data.session ? data.session : null;",
        "  setSession(sess);",
        "  setAuthReady(true);",
        "  await applyAccountPremium(sess);",
        "});"
      ].join("\n    ");
      if (html.indexOf(needle) !== -1) return html.split(needle).join(patch);
      var loose = /sb\.auth\.getSession\(\)\.then\(async \(\{ data \}\) => \{[\s\S]*?await applyAccountPremium\(data\.session \|\| null\);\s*\}\);/;
      if (loose.test(html)) return html.replace(loose, patch);
      console.warn("iOS getSession patch not applied — pattern not found");
      return html;
    }
    function boot(html) {
      try {
        html = applyIosSessionTimeoutFix(html);
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        console.error(e);
        var el = document.getElementById("boot");
        if (el) el.innerHTML = "<h1>THE PLAYBOOK</h1><p>Could not start. <a href=\"" + SRC + "\">Open working version</a></p>";
      }
    }
    fetch(SRC, { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(boot)
      .catch(function (err) {
        console.error(err);
        var el = document.getElementById("boot");
        if (el) el.innerHTML = "<h1>THE PLAYBOOK</h1><p>Network issue loading the app.</p><p><a href=\"" + SRC + "\">Open working version</a></p>";
      });
  })();
  </script>
</body>
</html>
