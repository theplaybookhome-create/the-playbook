<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE PLAYBOOK — Loading…</title>
  <style>body{margin:0;background:#F7F6F4;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#2C3E50}</style>
</head>
<body>
  <p id="msg">Loading THE PLAYBOOK…</p>
  <script>
  (function () {
    var src = "https://cdn.jsdelivr.net/gh/theplaybookhome-create/the-playbook@88b325a34ccd3beccc9a8b831911da2c249bfa9d/app.html";
    var qs = window.location.search || "";
    fetch(src)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (html) {
        // Keep relative assets (PDFs, icons) on this origin
        document.open();
        document.write(html);
        document.close();
        // Re-apply unlock query if present (fetch drops navigation URL context for scripts that already ran)
        if (qs.indexOf("unlocked=1") >= 0) {
          try { localStorage.setItem("playbook:premium-unlocked", "1"); } catch (e) {}
        }
      })
      .catch(function (err) {
        document.getElementById("msg").textContent = "Could not load app. Refresh, or open https://theplaybook.cloud/app.html again.";
        console.error(err);
      });
  })();
  </script>
</body>
</html>
