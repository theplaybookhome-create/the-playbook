<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1219" />
  <meta name="description" content="A one-page school week log. Energy, mood, sleep, what helped, and a line for the teacher. Nothing is sent." />
  <title>School week — THE PLAYBOOK</title>
  <style>
    :root { --ink:#0E131F; --muted:#6B7280; --line:#E6E8EC; --orange:#FF8A2B; --bg:#F6F7F9; --navy:#0B1219; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { background: var(--navy); color: #fff; padding: 16px 16px 14px; }
    header .brand { margin: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; color: #FFB067; }
    header h1 { margin: 6px 0 4px; font-size: 26px; }
    header p { margin: 0; color: #C5CDD6; font-size: 14px; line-height: 1.4; }
    main { max-width: 720px; margin: 0 auto; padding: 12px 16px 32px; }
    .who { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
    .who label { flex: 1 1 180px; font-size: 12px; font-weight: 700; }
    .print-btn { flex: 0 0 auto; border: 0; background: var(--orange); color: #fff; border-radius: 12px; padding: 14px 18px; font-weight: 800; font-size: 16px; cursor: pointer; min-height: 48px; }
    .day { background: #fff; border: 1.5px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
    .day h2 { margin: 0 0 10px; font-size: 18px; }
    .day h2 .short { display: none; }
    .row-label { display: block; font-size: 12px; font-weight: 700; margin: 8px 0 6px; }
    .energy, .moods { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .scale, .chip { position: relative; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; font-weight: 800; cursor: pointer; }
    .scale { width: 48px; font-size: 16px; }
    .chip { padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 700; }
    .scale input, .chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
    .scale:has(input:checked), .chip:has(input:checked) { background: var(--orange); border-color: #E07A1A; color: #fff; }
    .chip:has(input:focus-visible), .scale:has(input:focus-visible) { outline: 2px solid var(--navy); outline-offset: 2px; }
    input[type="text"] { width: 100%; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; min-height: 48px; color: var(--ink); background: #fff; }
    .teacher input { background: #FFF8F2; }
    footer { max-width: 720px; margin: 0 auto; padding: 4px 16px 28px; font-size: 14px; }
    footer a { color: var(--orange); font-weight: 800; }
    .stay { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    @page { size: A4 portrait; margin: 8mm; }
    @media print {
      body { background: #fff; }
      header { background: #fff; color: var(--ink); padding: 0 0 4px; border-bottom: 3px solid var(--navy); }
      header .brand { color: var(--orange); }
      header h1 { font-size: 16px; margin: 0; }
      header p { display: none; }
      main, footer { max-width: none; padding: 0; }
      .print-btn, .stay { display: none !important; }
      .who { gap: 8px; margin: 4px 0 2px; }
      .who label { font-size: 10px; }
      .day { border: 0; border-bottom: 1px solid #ccc; border-radius: 0; padding: 3px 0 2px; margin: 0; break-inside: avoid; page-break-inside: avoid; }
      .day h2 { font-size: 12px; margin: 0; }
      .day h2 .long { display: none; }
      .day h2 .short { display: inline; }
      .row-label { font-size: 9px; margin: 1px 0; display: inline; }
      .energy, .moods { display: inline-flex; gap: 3px; }
      .scale, .chip { min-height: 0; height: 16px; width: auto; padding: 0 4px; font-size: 9px; border-radius: 4px; border-width: 1px; }
      .scale { width: 16px; padding: 0; }
      .chip { display: none; }
      .chip:has(input:checked) { display: inline-flex; background: #fff; color: #111; border-color: #111; }
      input[type="text"] { min-height: 0; height: 14px; padding: 0 2px; font-size: 10px; border: 0; border-bottom: 1px solid #999; border-radius: 0; background: transparent; }
      .field { display: flex; gap: 6px; align-items: baseline; }
      .field .row-label { min-width: 68px; }
      footer { font-size: 9px; padding-top: 4px; }
      footer a { color: #111; }
    }
  </style>
</head>
<body>
  <header>
    <p class="brand">THE PLAYBOOK</p>
    <h1>School week</h1>
    <p>Monday to Friday. Energy, mood, sleep, what helped, and a line for the teacher. Print one page. Nothing on this page is sent anywhere.</p>
  </header>
  <main>
    <form id="week" autocomplete="off">
      <div class="who">
        <label>Child
          <input type="text" name="child" />
        </label>
        <label>Week of
          <input type="text" name="weekOf" placeholder="e.g. 6 Oct" />
        </label>
        <button type="button" class="print-btn" id="printBtn">Print</button>
      </div>
      <p class="stay">Stays on this phone if you come back. Not a diagnosis.</p>
    </form>
  </main>
  <footer>
    <a href="https://theplaybook.cloud">https://theplaybook.cloud</a>
  </footer>
  <script>
    (function () {
      var DAYS = [
        ["mon", "Monday", "Mon"],
        ["tue", "Tuesday", "Tue"],
        ["wed", "Wednesday", "Wed"],
        ["thu", "Thursday", "Thu"],
        ["fri", "Friday", "Fri"]
      ];
      var MOODS = ["Calm", "Happy", "Wobbly", "Overwhelmed", "Shutdown", "Big feelings"];
      var KEY = "playbook:week-sheet";
      var form = document.getElementById("week");

      DAYS.forEach(function (d) {
        var id = d[0], long = d[1], short = d[2];
        var section = document.createElement("section");
        section.className = "day";
        section.innerHTML =
          '<h2><span class="long">' + long + '</span><span class="short">' + short + '</span></h2>' +
          '<div class="field"><span class="row-label">Energy</span><div class="energy" role="group" aria-label="' + long + ' energy"></div></div>' +
          '<div class="field"><span class="row-label">Mood</span><div class="moods" role="group" aria-label="' + long + ' mood"></div></div>' +
          '<label class="field"><span class="row-label">Sleep</span><input type="text" name="' + id + '-sleep" /></label>' +
          '<label class="field"><span class="row-label">What helped</span><input type="text" name="' + id + '-helped" /></label>' +
          '<label class="field teacher"><span class="row-label">Teacher</span><input type="text" name="' + id + '-teacher" aria-label="' + long + ' teacher line" /></label>';
        var energy = section.querySelector(".energy");
        for (var n = 1; n <= 5; n++) {
          var lab = document.createElement("label");
          lab.className = "scale";
          lab.innerHTML = '<input type="radio" name="' + id + '-energy" value="' + n + '"><span>' + n + '</span>';
          energy.appendChild(lab);
        }
        var moods = section.querySelector(".moods");
        MOODS.forEach(function (m) {
          var chip = document.createElement("label");
          chip.className = "chip";
          chip.innerHTML = '<input type="checkbox" name="' + id + '-mood" value="' + m + '"><span>' + m + '</span>';
          moods.appendChild(chip);
        });
        form.insertBefore(section, form.querySelector(".stay"));
      });

      function read() {
        var data = {};
        form.querySelectorAll("input").forEach(function (el) {
          if (el.type === "radio") {
            if (el.checked) data[el.name] = el.value;
          } else if (el.type === "checkbox") {
            data[el.name] = data[el.name] || [];
            if (el.checked) data[el.name].push(el.value);
          } else {
            data[el.name] = el.value;
          }
        });
        return data;
      }
      function write(data) {
        if (!data) return;
        form.querySelectorAll("input").forEach(function (el) {
          if (el.type === "radio") el.checked = data[el.name] === el.value;
          else if (el.type === "checkbox") el.checked = Array.isArray(data[el.name]) && data[el.name].indexOf(el.value) !== -1;
          else if (data[el.name] != null) el.value = data[el.name];
        });
      }
      function save() {
        try { localStorage.setItem(KEY, JSON.stringify(read())); } catch (e) {}
      }
      try { write(JSON.parse(localStorage.getItem(KEY) || "null")); } catch (e) {}
      form.addEventListener("input", save);
      form.addEventListener("change", save);
      form.addEventListener("submit", function (e) { e.preventDefault(); });
      document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    })();
  </script>
</body>
</html>
